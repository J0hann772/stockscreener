{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header border-bottom">
                <h4>{{ title }}</h4>
            </div>
            <div class="card-body px-4 py-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <h5>Основная информация</h5>
                    {{ form.as_p }}
                    
                    <hr class="my-4">
                    
                    <h5>Условия срабатывания (Индикаторы)</h5>
                    {{ formset.management_form }}
                    <div id="conditions-formset-container" class="mt-3">
                        {% for c_form in formset %}
                            <div class="condition-form p-3 border rounded mb-3 bg-light">
                                {{ c_form.as_p }}
                            </div>
                        {% endfor %}
                    </div>
                    
                    <!-- JS для логики формы в дальнейшем можно вынести -->
                    
                    <button type="submit" class="btn btn-success mt-4 px-4 w-100 fw-bold">Сохранить стратегию</button>
                    <a href="{% url 'strategy_list' %}" class="btn btn-outline-secondary mt-2 w-100">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
